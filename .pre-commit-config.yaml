repos:
  - repo: local
    hooks:
      - id: check-catalog
        name: Skill catalog consistency
        description: >-
          Every skill must declare catalog_summary in SKILL.md, have a
          matching README catalog row, and no stale/orphaned rows.
        entry: python3 scripts/check_catalog.py
        language: system
        pass_filenames: false
        files: ^(README\.md|[^/]+/SKILL\.md)$
      - id: check-workflows
        name: Personal workflow consistency
        description: >-
          Every personal workflow must follow the orchestration contract and
          have a matching workflows catalog entry.
        entry: python3 scripts/check_workflows.py
        language: system
        pass_filenames: false
        files: ^(workflows/|scripts/check_workflows\.py$)
